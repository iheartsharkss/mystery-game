<!DOCTYPE html>
<html>
<head>
    <title>Game Screen</title>

    <style>
        body {
            background-color: #f5f5f5;
            font-family: "Comic Sans MS", cursive;
        }

        .screen {
            border: 4px solid black;
            border-radius: 10px;
            height: 700px;
        }

        header {
            display: flex;
            justify-content: space-between;
        }

        .date, .inventory {
            border: 3px solid black;
            border-radius: 8px;
            padding: 25px;
            width: 180px;
            font-size: 25px;
            font-weight: bold;
        }

        .inventory {
            text-align: center;
        }

        main {
            text-align: center;
            margin-top: 100px;
        }

        .choice {
            display: block;
            margin: 30px auto;
            width: 60%;
            height: 70px;
            border: 3px solid black;
            border-radius: 8px;
            background-color: #f5f5f5;
            font-family: inherit;
            font-size: 25px;
            font-weight: bold;
        }

        .dialogue {
            border: 4px solid black;
            border-radius: 10px;
            margin: 120px 10px 20px 10px;
            height: 200px;
            padding: 10px;
            font-size: 25px;
            font-weight: bold;
        }

        .dialogue-text {
            text-align: center;
            margin-top: 40px;
        }

        footer {
            text-align: center;
        }

        .menu, .options {
            width: 120px;
            height: 60px;
            border: 3px solid black;
            border-radius: 8px;
            background-color: #f5f5f5;
            font-family: inherit;
            font-size: 20px;
            font-weight: bold;
            margin: 10px;
        }
    </style>
</head>

<body>

    <div class="screen">

        <header>
            <div class="date">
                Date
            </div>

            <div class="inventory">
                Inventory
            </div>
        </header>


        <main>
            <button class="choice">Choice 1</button>
            <button class="choice">Choice 2</button>

            <section class="dialogue">
                <div>Name of character</div>

                <div class="dialogue-text">
                    Where the text will appear
                    (both for context/blurb, dialogues, and thoughts)
                </div>
            </section>
        </main>


        <footer>
            <button class="menu">Menu</button>
            <button class="options">Options</button>
        </footer>

    </div>

</body>
</html>
