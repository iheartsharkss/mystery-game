<!DOCTYPE html>
<html>
<head>
    <title>Game Screen</title>

    <style>
        body {
            background-image: url("coffee-shop.webp");
            background-size: cover;
            font-family: "Comic Sans MS", cursive;
        }


        header {
            display: flex;
            justify-content: space-between;
        }
.dialogue-name {
    text-align: right;
    font-size: 18px;
    color: #4b3a32;
}

        .date {
    border: 3px solid #4b3a32;
    border-radius: 15px;
    background-color: #fff4e3;
    width: 130px;
    padding: 8px;
    text-align: center;
    font-size: 16px;
    color: #4b3a32;
}

.date strong {
    font-size: 32px;
}
        .inventory img {
    width: 150px;
}

        main {
            text-align: center;
            margin-top: 100px;
        }

        .choice {
            display: block;
            margin: 30px auto;
            width: 60%;
            height: 70px;
            border: 3px solid black;
            border-radius: 8px;
            background-color: #fff4e3;
            font-family: inherit;
            font-size: 25px;
            font-weight: bold;
        }

        .dialogue {
            border: 4px solid black;
            border-radius: 10px;
            background-color: #fff4e3;
            margin: 120px 10px 20px 10px;
            height: 200px;
            padding: 10px;
            font-size: 25px;
            font-weight: bold;
        }

        .dialogue-text {
            text-align: center;
            margin-top: 40px;
        }

        footer {
            text-align: center;
        }

        .menu, .options {
            width: 120px;
            height: 60px;
            border: 3px solid black;
            border-radius: 8px;
            background-color: #fff4e3;
            font-family: inherit;
            font-size: 20px;
            font-weight: bold;
            margin: 10px;
        }
    </style>
</head>

<body>

    <div class="screen">

        <header>
            <div class="date">
                Day 1
            </div>

           <div class="inventory">
    <img src="backpack.png" alt="backpack" style="width: 50px; height: 50px; vertical-align: middle;">
</div>
        </header>


        <main>
            <button class="choice">Ask about it</button>
            <button class="choice">Ignore it</button>

           <section class="dialogue">
    <div class="dialogue-name">MC</div>

    <div class="dialogue-text">
        Seems like the clients are talking about something suspicious.
    </div>
</section>
        </main>


        <footer>
            <button class="menu">Menu</button>
            <button class="options">Options</button>
        </footer>

    </div>

</body>
</html>
