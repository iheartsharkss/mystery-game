<!DOCTYPE html>
<html>
<head>
    <title>Coffee Shop</title>

    <style>
        body {
        background-image: url("Images/nightpark.jpg");
            background-size: cover;
            background-position: center;
            font-family: "Comic Sans MS", cursive;
        }


        header {
            display: flex;
            justify-content: space-between;
        }
.dialogue-name {
    text-align: right;
    font-size: 18px;
    color: darkolivegreen;
}

 
        .inventory img {
    width: 150px;
}

        main {
            text-align: center;
            margin-top: 100px;
        }

        .choice {
            display: block;
            margin: 30px auto;
            width: 60%;
            height: 70px;
            border: 3px solid darkolivegreen;
            border-radius: 8px;
            background-color: #d9cfc2;
            font-family: inherit;
            font-size: 25px;
            font-weight: bold;
             color: darkolivegreen;
            text-align: center;
            line-height: 70px;
            text-decoration: none;
        }

        .dialogue {
            border: 4px solid darkolivegreen;
            border-radius: 10px;
            background-color: #d9cfc2;
            margin: 120px 10px 20px 10px;
            height: auto;
            padding: 10px;
            font-size: 25px;
            color:darkolivegreen;
            font-weight: bold;
        }

        .dialogue-text {
            text-align: center;
            margin-top: 40px;
        }

        footer {
            text-align: center;
        }

        .menu, .options {
            width: 120px;
            height: 60px;
            border: 3px solid darkolivegreen;
            border-radius: 8px;
            background-color: #d9cfc2;
            font-family: inherit;
            font-size: 20px;
            font-weight: bold;
            color: darkolivegreen;
            margin: 10px;
        }
    </style>
</head>

<body>

    <div class="screen">

        <header>
        
           <div class="inventory">
    <img src="Images/backpack.png" alt="backpack" style="width: 50px; height: 50px; vertical-align: middle;">
    Items: <span id="inventory" style="display: inline-block; padding: 6px 10px; border: 2px solid #555; border-radius: 6px; background-color: #fff4e3; color: #333;">nothing yet</span>
</div>
        </header>


        <main>
            <a href="index copy 8.html" class="choice">Yes</a>
            <a href="index copy 7.html" class="choice">No</a>

           <section class="dialogue">
    <div class="dialogue-name">MC</div>

    <div class="dialogue-text">
       While walking back home after finding all those things out. You saw a brunette looking everywhere she walked. Since she seemed agitated you chose to approach her and ask if she was okay. She looked at you and asked if you have seen any letters on the floor earlier on.
    </div>
</section>
        </main>


        <footer>
            <button class="menu">Menu</button>
            <button class="options">Options</button>
        </footer>

    </div>
<script src="game.js"></script>
</body>
</html>
